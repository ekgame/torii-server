# Test deployment on Coolify: the API, its database and cache, the pp calculator,
# the spectator server and the nginx that puts them behind one hostname.
#
# No host ports, container names or bind mounts: Coolify routes the hostname to
# nginx, and a bind mount of a repository path would come up empty there.
services:
  nginx:
    build:
      context: ./nginx
      dockerfile_inline: |
        FROM nginx:alpine
        COPY default.conf /etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - spectator
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # The migrations alone don't build everything the models use: see the script.
    command:
      - sh
      - -c
      - PYTHONPATH=. python tools/fill_schema_gaps.py && exec uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: osu_api
      MYSQL_USER: osu_api
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${SERVICE_PASSWORD_64_JWT}
      SERVER_URL: ${SERVER_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_URLS: '["${FRONTEND_URL}"]'
      FETCHER_CLIENT_ID: ${FETCHER_CLIENT_ID}
      FETCHER_CLIENT_SECRET: ${FETCHER_CLIENT_SECRET}
      CALCULATOR: performance_server
      CALCULATOR_CONFIG: '{"server_url":"http://performance-server:8080"}'
      STORAGE_SERVICE: local
      STORAGE_SETTINGS: '{"local_storage_path":"./storage"}'
      ENABLE_ALL_BEATMAP_LEADERBOARD: "true"
      ENABLE_ALL_BEATMAP_PP: "true"
      ENABLE_TURNSTILE_VERIFICATION: "false"
      ENABLE_TOTP_VERIFICATION: "false"
      ENABLE_EMAIL_VERIFICATION: "false"
      ENABLE_SESSION_VERIFICATION: "false"
      ENABLE_RATE_LIMIT: "false"
      # A development build of the game isn't on the list of released versions.
      CHECK_CLIENT_VERSION: "false"
      LOG_LEVEL: INFO
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      performance-server:
        condition: service_started
    volumes:
      - app_config:/app/config
      - app_storage:/app/storage
      - app_replays:/app/replays
      - app_geoip:/app/geoip
    restart: unless-stopped

  spectator:
    build:
      context: https://github.com/ShikkesoraSIM/torii-server-spectator.git#fix/spectator-v2-20261021:osu.Server.Spectator
    # Coolify only shows the logs of nginx: keep a copy where a command in the container can read it.
    entrypoint:
      - sh
      - -c
      - dotnet osu.Server.Spectator.dll 2>&1 | tee -a /app/replays/spectator.log
    environment:
      SERVER_PORT: 80
      SAVE_REPLAYS: 1
      REPLAY_UPLOAD_THREADS: 1
      REPLAYS_PATH: /app/replays
      BANCHO_BOT_USER_ID: 2
      ENABLE_ALL_BEATMAP_LEADERBOARD: 1
      ENABLE_BEATMAP_STATUS_POLLING: "false"
      REDIS_HOST: redis
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: osu_api
      DB_NAME: osu_api
      DB_PASS: ${SERVICE_PASSWORD_MYSQL}
      DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: osu_api
      MYSQL_DATABASE: osu_api
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      USE_LEGACY_RSA_AUTH: "false"
      OSU_CLIENT_ID: 5
      JWT_ALGORITHM: HS256
      ALGORITHM: HS256
      JWT_SECRET_KEY: ${SERVICE_PASSWORD_64_JWT}
      SHARED_INTEROP_DOMAIN: http://app:8000
      SHARED_INTEROP_SECRET: ${SERVICE_PASSWORD_64_INTEROP}
      DD_AGENT_HOST: localhost
      # Must be set, even to nothing, or the server refuses to start.
      SENTRY_DSN: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - spectator_replays:/app/replays
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command:
      - "--max-connections=500"
      - "--default-time-zone=+00:00"
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      MYSQL_DATABASE: osu_api
      MYSQL_USER: osu_api
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 10s
    restart: unless-stopped

  # Mania uses this one too here: the separate mania calculator is left out.
  performance-server:
    build:
      context: ./docker/performance-server-net10
      dockerfile: Dockerfile
    environment:
      SAVE_BEATMAP_FILES: "false"
    restart: unless-stopped

volumes:
  app_config:
  app_storage:
  app_replays:
  app_geoip:
  mysql_data:
  redis_data:
  spectator_replays:
